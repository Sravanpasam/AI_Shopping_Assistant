<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ShopStore — an online store with the ShopBot assistant: browse and compare products, check store policies, track orders, and ask in your own words (typed or voice).">
  <title>ShopStore — Shop with ShopBot</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>

  <!-- ============================== Site header ============================== -->
  <header class="site-header">
    <div class="site-header-inner">
      <a class="store-brand" href="#/" id="brandLink" aria-label="ShopStore home">
        <span class="store-logo" aria-hidden="true">🛍️</span>
        <span class="store-name">Shop<span class="store-name-accent">Store</span></span>
      </a>

      <form class="store-search" id="headerSearchForm" role="search" autocomplete="off">
        <label class="sr-only" for="headerSearchInput">Search products</label>
        <input
          class="store-search-input"
          id="headerSearchInput"
          type="search"
          placeholder="Search products…"
          aria-label="Search products"
        >
        <button class="store-search-submit" type="submit" aria-label="Search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
      </form>

      <div class="site-header-actions">
        <a class="header-cart-link" id="cartLink" href="#/cart" aria-label="Cart">
          <span class="header-cart-icon" aria-hidden="true">🛒</span>
          <span class="header-cart-text">Cart</span>
          <span class="header-cart-count" id="cartCount" aria-live="polite">0</span>
        </a>
        <button class="header-chat-link" id="headerChatBtn" type="button">Ask ShopBot</button>
        <button class="lang-switch" id="langSwitcher" type="button" title="Chat language / لغة المحادثة" aria-label="Switch chat language">
          <span class="lang-switch-flag" id="langSwitchFlag">🇬🇧</span>
          <span class="lang-switch-text" id="langSwitchText">EN</span>
        </button>
      </div>
    </div>

    <!-- Category tabs (built by app.js) -->
    <nav class="category-tabs" id="categoryTabs" aria-label="Product categories"></nav>
  </header>

  <!-- ============================ Compare bar ============================ -->
  <div class="compare-bar" id="compareBar" hidden>
    <span class="compare-bar-text" id="compareBarText">0 products selected</span>
    <div class="compare-bar-actions">
      <a class="btn btn-primary compare-bar-go" id="compareBarGo" href="#/compare">Compare</a>
      <button class="btn btn-ghost compare-bar-clear" id="compareBarClear" type="button">Clear</button>
    </div>
  </div>

  <!-- ============================== Main view ============================== -->
  <main class="view" id="view" tabindex="-1"></main>

  <!-- ================================ Footer ============================== -->
  <footer class="site-footer">
    <div class="site-footer-inner">
      <div class="footer-brand">
        <span class="store-logo" aria-hidden="true">🛍️</span>
        <span class="store-name">Shop<span class="store-name-accent">Store</span></span>
        <p class="footer-note">A demo storefront for the ShopBot university NLP project. No real orders are placed, and all store policies are fictional.</p>
      </div>
      <div class="footer-links">
        <a class="footer-link" href="#/help/returns">Returns</a>
        <a class="footer-link" href="#/help/warranty">Warranty</a>
        <a class="footer-link" href="#/help/shipping">Shipping</a>
        <a class="footer-link" href="#/help/payment">Payment</a>
        <a class="footer-link" href="#/help/orders">Order tracking</a>
      </div>
    </div>
  </footer>

  <!-- ========================= ShopBot assistant ==========================
       The assistant is a self-contained Shadow-DOM widget in shopbot/. It
       mounts itself on load and is configured by app.js (host callbacks). No
       chat markup belongs in this page. -->

  <!-- Toast notifications -->
  <div class="toast-container" id="toastContainer" aria-live="assertive" aria-atomic="true"></div>

  <script src="common.js"></script>
  <script src="shopbot/shopbot.js"></script>
  <script src="app.js"></script>
</body>
</html>
